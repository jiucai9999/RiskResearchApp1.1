name: Build Windows Desktop EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install streamlit pandas pyinstaller pywebview

      - name: Build EXE
        run: |
          pyinstaller desktop.py ^
            --onefile ^
            --noconsole ^
            --collect-all streamlit ^
            --collect-all webview ^
            --name RiskResearchApp

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RiskResearchApp
          path: dist/RiskResearchApp.exe
