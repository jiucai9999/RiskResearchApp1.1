name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          run: pyinstaller desktop.py --onefile --noconsole --collect-all streamlit --name RiskResearchApp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiskResearchApp
          path: dist/RiskResearchApp.exe
